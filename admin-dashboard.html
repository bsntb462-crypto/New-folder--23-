<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة التحكم - بيانات التواصل</title>
<style>
  :root{
    --bg-1:#0b0f17;
    --bg-2:#131a27;
    --accent:#5b8cff;
    --accent-2:#7ee0c9;
    --text:#eaf0ff;
    --muted:#8b98b3;
    --danger:#ff6b6b;
    --card-border:rgba(255,255,255,0.08);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    font-family:"Segoe UI", Tahoma, Arial, sans-serif;
    background:radial-gradient(1200px 600px at 20% 10%, #17233a 0%, transparent 60%),
               radial-gradient(1000px 500px at 90% 90%, #12241f 0%, transparent 55%),
               linear-gradient(160deg, var(--bg-1), var(--bg-2));
    color:var(--text);
  }
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:20px 30px;
    border-bottom:1px solid var(--card-border);
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .dot{
    width:10px;height:10px;border-radius:50%;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    box-shadow:0 0 12px var(--accent);
  }
  .brand span{font-weight:600;letter-spacing:.3px;font-size:15px;}
  #logoutBtn{
    padding:9px 16px;
    border-radius:9px;
    border:1px solid var(--card-border);
    background:rgba(255,255,255,0.04);
    color:var(--text);
    font-size:13.5px;
    cursor:pointer;
    transition:background .15s;
  }
  #logoutBtn:hover{background:rgba(255,107,107,0.12);border-color:rgba(255,107,107,0.3);}

  main{
    display:flex;
    justify-content:center;
    padding:50px 20px;
  }
  .card{
    width:100%;
    max-width:460px;
    padding:34px 32px;
    border-radius:18px;
    background:rgba(255,255,255,0.045);
    border:1px solid var(--card-border);
    backdrop-filter:blur(18px);
    box-shadow:0 20px 60px rgba(0,0,0,0.45);
  }
  h1{font-size:20px;margin:0 0 4px;font-weight:700;}
  p.sub{margin:0 0 26px;color:var(--muted);font-size:13.5px;}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;}
  .field{margin-bottom:18px;}
  input{
    width:100%;
    padding:12px 14px;
    border-radius:10px;
    border:1px solid var(--card-border);
    background:rgba(255,255,255,0.04);
    color:var(--text);
    font-size:14px;
    outline:none;
    transition:border-color .15s, background .15s;
  }
  input:focus{border-color:var(--accent);background:rgba(91,140,255,0.08);}
  button[type="submit"]{
    width:100%;
    padding:13px;
    margin-top:6px;
    border:none;
    border-radius:10px;
    background:linear-gradient(135deg,var(--accent),#3b63d6);
    color:#fff;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:transform .12s, opacity .12s;
  }
  button[type="submit"]:hover{transform:translateY(-1px);}
  button[type="submit"]:disabled{opacity:.6;cursor:not-allowed;transform:none;}
  .message{
    margin-top:16px;
    font-size:13px;
    padding:10px 12px;
    border-radius:8px;
    display:none;
  }
  .message.error{
    display:block;
    background:rgba(255,107,107,0.12);
    color:var(--danger);
    border:1px solid rgba(255,107,107,0.3);
  }
  .message.success{
    display:block;
    background:rgba(126,224,201,0.12);
    color:var(--accent-2);
    border:1px solid rgba(126,224,201,0.3);
  }
  .loading-screen{
    position:fixed;inset:0;
    display:flex;align-items:center;justify-content:center;
    background:var(--bg-1);
    color:var(--muted);
    font-size:14px;
    z-index:10;
  }
</style>
</head>
<body>

  <div id="loadingScreen" class="loading-screen">جاري التحقق من تسجيل الدخول...</div>

  <header>
    <div class="brand"><span class="dot"></span><span>لوحة التحكم</span></div>
    <button id="logoutBtn">تسجيل الخروج</button>
  </header>

  <main>
    <div class="card">
      <h1>بيانات التواصل</h1>
      <p class="sub">التعديلات هنا بتتحفظ مباشرة في siteSettings/contact</p>

      <form id="settingsForm">
        <div class="field">
          <label for="whatsapp">رقم الواتساب</label>
          <input type="text" id="whatsapp" placeholder="مثال: 201001234567">
        </div>
        <div class="field">
          <label for="facebook">رابط صفحة الفيسبوك</label>
          <input type="url" id="facebook" placeholder="https://facebook.com/yourpage">
        </div>
        <div class="field">
          <label for="email">البريد الإلكتروني</label>
          <input type="email" id="email" placeholder="info@example.com">
        </div>
        <button type="submit" id="saveBtn">حفظ التغييرات</button>
      </form>

      <div id="dashMsg" class="message"></div>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import {
      getAuth,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
    import {
      getFirestore,
      doc,
      getDoc,
      setDoc
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

    // ⚠️ نفس الـ Firebase Configuration بتاعك
    const firebaseConfig = {
      apiKey: "AIzaSyChZpbFpUx5w0gASN9ulj1kyyDK8WRTmBU",
      authDomain: "dashboard-3a8b1.firebaseapp.com",
      projectId: "dashboard-3a8b1",
      storageBucket: "dashboard-3a8b1.firebasestorage.app",
      messagingSenderId: "582254618092",
      appId: "1:582254618092:web:288ad466c2601023170cc9"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const loadingScreen = document.getElementById("loadingScreen");
    const settingsForm = document.getElementById("settingsForm");
    const whatsappInput = document.getElementById("whatsapp");
    const facebookInput = document.getElementById("facebook");
    const emailInput = document.getElementById("email");
    const saveBtn = document.getElementById("saveBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const dashMsg = document.getElementById("dashMsg");

    function showDashMessage(text, type){
      dashMsg.className = "message " + type;
      dashMsg.textContent = text;
      setTimeout(() => { dashMsg.className = "message"; }, 4000);
    }

    // 1. حماية الصفحة: لو مش مسجل دخول، رجّعها لصفحة اللوجين
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "admin-login.html";
        return;
      }
      loadingScreen.style.display = "none";
      await loadCurrentData();
    });

    // 2. جلب البيانات الحالية من Firestore وعرضها في الفورم
    async function loadCurrentData() {
      try {
        const docRef = doc(db, "siteSettings", "contact");
        const docSnap = await getDoc(docRef);
        if (docSnap.exists()) {
          const data = docSnap.data();
          whatsappInput.value = data.whatsapp || '';
          facebookInput.value = data.facebook || '';
          emailInput.value = data.email || '';
        }
      } catch (error) {
        showDashMessage('تعذر جلب البيانات الحالية: ' + error.message, 'error');
      }
    }

    // 3. حفظ البيانات في Firestore (siteSettings/contact)
    settingsForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      saveBtn.disabled = true;
      saveBtn.textContent = 'جاري الحفظ...';

      try {
        const docRef = doc(db, "siteSettings", "contact");
        await setDoc(docRef, {
          whatsapp: whatsappInput.value.trim(),
          facebook: facebookInput.value.trim(),
          email: emailInput.value.trim()
        }, { merge: true });

        showDashMessage('تم حفظ التعديلات بنجاح! 🎉', 'success');
      } catch (error) {
        showDashMessage('حدث خطأ أثناء الحفظ: ' + error.message, 'error');
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = 'حفظ التغييرات';
      }
    });

    // 4. تسجيل الخروج
    logoutBtn.addEventListener('click', () => {
      signOut(auth);
    });
  </script>

</body>
</html>
