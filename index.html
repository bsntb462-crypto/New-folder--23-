<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل الدخول - لوحة التحكم</title>
<style>
  :root{
    --bg-1:#0b0f17;
    --bg-2:#131a27;
    --accent:#5b8cff;
    --accent-2:#7ee0c9;
    --text:#eaf0ff;
    --muted:#8b98b3;
    --danger:#ff6b6b;
    --card-border:rgba(255,255,255,0.08);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:"Segoe UI", Tahoma, Arial, sans-serif;
    background:radial-gradient(1200px 600px at 20% 10%, #17233a 0%, transparent 60%),
               radial-gradient(1000px 500px at 90% 90%, #12241f 0%, transparent 55%),
               linear-gradient(160deg, var(--bg-1), var(--bg-2));
    color:var(--text);
  }
  .card{
    width:100%;
    max-width:380px;
    padding:36px 32px;
    border-radius:18px;
    background:rgba(255,255,255,0.045);
    border:1px solid var(--card-border);
    backdrop-filter:blur(18px);
    box-shadow:0 20px 60px rgba(0,0,0,0.45);
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:26px;
  }
  .brand .dot{
    width:10px;height:10px;border-radius:50%;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    box-shadow:0 0 12px var(--accent);
  }
  .brand span{font-weight:600;letter-spacing:.3px;color:var(--muted);font-size:14px;}
  h1{
    font-size:22px;
    margin:0 0 6px;
    font-weight:700;
  }
  p.sub{
    margin:0 0 26px;
    color:var(--muted);
    font-size:13.5px;
  }
  label{
    display:block;
    font-size:13px;
    color:var(--muted);
    margin-bottom:6px;
  }
  .field{margin-bottom:16px;}
  input{
    width:100%;
    padding:12px 14px;
    border-radius:10px;
    border:1px solid var(--card-border);
    background:rgba(255,255,255,0.04);
    color:var(--text);
    font-size:14px;
    outline:none;
    transition:border-color .15s, background .15s;
  }
  input:focus{
    border-color:var(--accent);
    background:rgba(91,140,255,0.08);
  }
  button{
    width:100%;
    padding:13px;
    margin-top:6px;
    border:none;
    border-radius:10px;
    background:linear-gradient(135deg,var(--accent),#3b63d6);
    color:#fff;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:transform .12s, opacity .12s;
  }
  button:hover{transform:translateY(-1px);}
  button:disabled{opacity:.6;cursor:not-allowed;transform:none;}
  .message{
    margin-top:16px;
    font-size:13px;
    padding:10px 12px;
    border-radius:8px;
    display:none;
  }
  .message.error{
    display:block;
    background:rgba(255,107,107,0.12);
    color:var(--danger);
    border:1px solid rgba(255,107,107,0.3);
  }
  .message.success{
    display:block;
    background:rgba(126,224,201,0.12);
    color:var(--accent-2);
    border:1px solid rgba(126,224,201,0.3);
  }
</style>
</head>
<body>

  <div class="card">
    <div class="brand"><span class="dot"></span><span>لوحة التحكم</span></div>
    <h1>تسجيل الدخول</h1>
    <p class="sub">سجّل دخولك بحساب الأدمن للوصول للوحة التحكم</p>

    <form id="loginForm">
      <div class="field">
        <label for="email">البريد الإلكتروني</label>
        <input type="email" id="email" required placeholder="admin@example.com" autocomplete="username">
      </div>
      <div class="field">
        <label for="password">كلمة المرور</label>
        <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
      </div>
      <button type="submit" id="loginBtn">دخول</button>
    </form>

    <div id="msg" class="message"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

    // ⚠️ نفس الـ Firebase Configuration بتاعك
    const firebaseConfig = {
      apiKey: "AIzaSyChZpbFpUx5w0gASN9ulj1kyyDK8WRTmBU",
      authDomain: "dashboard-3a8b1.firebaseapp.com",
      projectId: "dashboard-3a8b1",
      storageBucket: "dashboard-3a8b1.firebasestorage.app",
      messagingSenderId: "582254618092",
      appId: "1:582254618092:web:288ad466c2601023170cc9"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const loginForm = document.getElementById("loginForm");
    const loginBtn = document.getElementById("loginBtn");
    const msg = document.getElementById("msg");

    function showMsg(text, type){
      msg.textContent = text;
      msg.className = "message " + type;
    }

    // لو المستخدم داخل بالفعل، وديه على الداشبورد مباشرة
    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.location.href = "admin-dashboard.html";
      }
    });

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      loginBtn.disabled = true;
      loginBtn.textContent = "جاري الدخول...";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        await signInWithEmailAndPassword(auth, email, password);
        showMsg("تم تسجيل الدخول بنجاح، جاري التحويل...", "success");
        window.location.href = "admin-dashboard.html";
      } catch (error) {
        let text = "حدث خطأ أثناء تسجيل الدخول";
        if (error.code === "auth/invalid-credential" || error.code === "auth/wrong-password" || error.code === "auth/user-not-found") {
          text = "البريد الإلكتروني أو كلمة المرور غير صحيحة";
        } else if (error.code === "auth/invalid-email") {
          text = "صيغة البريد الإلكتروني غير صحيحة";
        } else if (error.code === "auth/too-many-requests") {
          text = "محاولات كتير خاطئة، حاول بعد شوية";
        }
        showMsg(text, "error");
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = "دخول";
      }
    });
  </script>

</body>
</html>
